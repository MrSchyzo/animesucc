<!DOCTYPE html>
<html lang="it">
<head><title>AnimeSaturn - Naruto Streaming Sub ITA</title></head>
<body>
  <h1 class="text-2xl font-display">Naruto</h1>

  <!-- Primary CTAs also link to /episode/... and duplicate grid entries; must be deduped. -->
  <div class="ag-cta">
    <a href="/episode/naruto-iN621/ep-1" class="btn-primary">Guarda l'episodio (1)</a>
    <a href="/episode/naruto-iN621/ep-3" class="btn-ghost">Guarda l'ultimo episodio (3)</a>
  </div>

  <!-- Episodes are listed out of order to exercise sorting. -->
  <div class="episodes-grid">
    <a href="/episode/naruto-iN621/ep-3">Episodio 3</a>
    <a href="/episode/naruto-iN621/ep-1">Episodio 1</a>
    <a href="/episode/naruto-iN621/ep-2">Episodio 2</a>
  </div>

  <!-- A related-anime link (not an episode) must be ignored. -->
  <aside class="related">
    <a href="/anime/road-of-naruto-ZZZZ" class="ac">Road of Naruto</a>
  </aside>
</body>
</html>
