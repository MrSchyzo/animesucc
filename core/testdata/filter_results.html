<!DOCTYPE html>
<html lang="it">
<head><title>AnimeSaturn - Ricerca</title></head>
<body>
  <!-- Hero / "In evidenza" slider: links to /anime/... but is NOT a result card.
       Must be excluded by scoping to a.ac. -->
  <div class="hero-slide">
    <div class="hero-actions">
      <a href="/anime/spotlight-anime-HERO0" class="hero-btn hero-btn-play">Guarda ora</a>
      <a href="/anime/spotlight-anime-HERO0" class="hero-btn hero-btn-info">Dettagli</a>
    </div>
  </div>

  <section class="fl-grid grid">
    <a href="/anime/naruto-iN621" class="ac group">
      <div class="ac__poster">
        <img src="https://img.saturncdn.net/static/images/locandine/17405l.jpg" alt="Naruto" loading="lazy">
        <div class="ac__topbar"><span class="ac__type-badge">TV</span></div>
      </div>
      <div class="ac__caption">
        <h3 class="ac__title">Naruto</h3>
        <p class="ac__sub">3 Ottobre 2002 &middot; 220 ep</p>
      </div>
    </a>

    <a href="/anime/one-piece-PmTvj" class="ac group">
      <div class="ac__poster">
        <img src="https://img.saturncdn.net/static/images/locandine/onepiece.jpg" alt="One Piece" loading="lazy">
        <div class="ac__topbar"><span class="ac__type-badge">TV</span></div>
      </div>
      <div class="ac__caption">
        <h3 class="ac__title">One Piece</h3>
        <p class="ac__sub">20 Ottobre 1999 &middot; 1168 ep</p>
      </div>
    </a>
  </section>
</body>
</html>
